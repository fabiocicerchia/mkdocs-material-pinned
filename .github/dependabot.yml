version: 2
updates:
  # Keep the pinned action SHAs in the workflows fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Everything else rides in one pull request rather than one each.
      actions:
        patterns: ["*"]

  # Base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # requirements.txt is the product: the pinned docs toolchain this image ships.
  # A bump here is a new image tag, so these PRs are releases, not chores.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
