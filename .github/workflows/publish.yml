name: Publish Image

# The image tag IS the bundled mkdocs-material version — that is the whole
# promise of this image — so requirements.txt drives the release, not a semver
# tag. Bumping the pin on main publishes that version. There is nothing for
# release-please to decide here, which is why it no longer governs this repo.
#
# The image is built once for amd64 and put through this repo's own test.sh
# before anything is pushed. Publishing an artifact that has never been started
# is the failure worth spending two minutes of runner time to avoid.

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

env:
  # GHCR links a package to its repository via
  # org.opencontainers.image.source in the Dockerfile — check that label is
  # this repo before the first release, or the package attaches elsewhere.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deriving the tag from the pin is what makes a mismatch unrepresentable,
      # so the old tag-vs-pin assertion is gone. An unreadable pin is still
      # worth failing on: it would otherwise publish `:` and `:latest`.
      - name: Read pinned mkdocs-material version
        id: ver
        run: |
          PINNED="$(sed -n 's/^mkdocs-material==\(.*\)$/\1/p' requirements.txt)"
          if [ -z "$PINNED" ]; then
            echo "::error::no 'mkdocs-material==<version>' line in requirements.txt"
            exit 1
          fi
          echo "publishing mkdocs-material $PINNED"
          echo "version=$PINNED" >> "$GITHUB_OUTPUT"

      # Single-arch, loaded into the local daemon, so test.sh can actually run
      # it. buildx caches the layers, so the multi-arch build below reuses this
      # work for amd64 rather than repeating it.
      - name: Build amd64 for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci-test

      # Scaffolds a real Material site with the bundled plugins enabled and
      # builds it --strict, so a plugin that installs but no longer loads fails
      # here instead of shipping.
      - name: Smoke test
        run: ./test.sh "${{ env.IMAGE }}:ci-test"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
