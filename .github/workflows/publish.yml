name: Publish Image

# Builds and pushes the multi-arch image to GHCR whenever a GitHub Release is
# published — by release-please or manually. Decoupled from release-please's
# own internal state so any published release triggers it.
#
# The image is built once for amd64 and put through this repo's own test.sh
# before anything is pushed. Publishing an artifact that has never been started
# is the failure worth spending two minutes of runner time to avoid.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  # GHCR links a package to its repository via
  # org.opencontainers.image.source in the Dockerfile — check that label is
  # this repo before the first release, or the package attaches elsewhere.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version (strip leading v)
        id: ver
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tag *is* the bundled mkdocs-material version — that is the whole
      # promise of this image. A release tagged v9.6.15 that ships 9.7.0 would
      # be a silently broken pin, so fail here rather than publish it.
      - name: Tag must match the pinned mkdocs-material version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PINNED="$(sed -n 's/^mkdocs-material==\(.*\)$/\1/p' requirements.txt)"
          # Allow a rebuild suffix: 9.6.15-r2 ships mkdocs-material 9.6.15.
          case "$VERSION" in
            "$PINNED"|"$PINNED"-r*) echo "tag $VERSION matches pin $PINNED" ;;
            *) echo "::error::tag $VERSION does not match mkdocs-material==$PINNED" ; exit 1 ;;
          esac

      # Single-arch, loaded into the local daemon, so test.sh can actually run
      # it. buildx caches the layers, so the multi-arch build below reuses this
      # work for amd64 rather than repeating it.
      - name: Build amd64 for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci-test

      # Scaffolds a real Material site with the bundled plugins enabled and
      # builds it --strict, so a plugin that installs but no longer loads fails
      # here instead of shipping.
      - name: Smoke test
        run: ./test.sh "${{ env.IMAGE }}:ci-test"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
