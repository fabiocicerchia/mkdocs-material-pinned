site_name: pinned-docs-demo
site_description: >-
  A minimal Material site that exercises the bundled plugins, so a strict
  build actually proves they load.

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

# Enabled explicitly: the image ships the versions, the config is yours.
plugins:
  - search
  - minify:
      minify_html: true
  - awesome-pages
  # Needs real git history — a shallow checkout dates every page to 1970.
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - pymdownx.superfences

nav:
  - Home: index.md
